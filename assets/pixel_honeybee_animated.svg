<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<title>Pixel-art honeybee mascot (animated)</title>
<desc>An animated pixel-art honeybee: it hovers up and down, its wings flap, its antennae twitch and it blinks. Yellow body with dark stripes, two light blue wings, dark eyes with white highlights, a small mouth and a stinger.</desc>
<style>
  /* Poori animation ka loop 4.8s ka hai: bob 2.4s, wings 0.32s, antenna 1.6s, blink 4.8s */
  .shadow { transform-origin: 340px 346px; animation: shadow 2.4s ease-in-out infinite; }
  .bee    { animation: bob 2.4s ease-in-out infinite; }

  .wing-l { transform-origin: 238px 164px; animation: flap-l 0.32s steps(1, end) infinite; }
  .wing-r { transform-origin: 442px 164px; animation: flap-r 0.32s steps(1, end) infinite; }

  .ant-l  { transform-origin: 307px 68px; animation: wig-l 1.6s steps(1, end) infinite; }
  .ant-r  { transform-origin: 373px 68px; animation: wig-r 1.6s steps(1, end) infinite -0.8s; }

  .eyes   { transform-origin: 340px 134px; animation: blink 4.8s steps(1, end) infinite; }
  .glint  { animation: glint 4.8s steps(1, end) infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-18px); }
  }
  @keyframes shadow {
    0%, 100% { transform: scale(1);   opacity: 0.12; }
    50%      { transform: scale(0.8); opacity: 0.07; }
  }
  @keyframes flap-l {
    0%   { transform: rotate(10deg); }
    50%  { transform: rotate(-12deg); }
  }
  @keyframes flap-r {
    0%   { transform: rotate(-10deg); }
    50%  { transform: rotate(12deg); }
  }
  @keyframes wig-l {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-12deg); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(8deg); }
  }
  @keyframes wig-r {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(12deg); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(-8deg); }
  }
  /* Blink: ~4.4s pe palak jhapakti hai */
  @keyframes blink {
    0%   { transform: scaleY(1); }
    92%  { transform: scaleY(0.12); }
    96%  { transform: scaleY(1); }
  }
  @keyframes glint {
    0%   { opacity: 1; }
    92%  { opacity: 0; }
    96%  { opacity: 1; }
  }
</style>

<ellipse class="shadow" cx="340" cy="346" rx="110" ry="8" fill="#000" opacity="0.12"/>

<g class="bee">
  <!-- Left wing -->
  <g class="wing-l">
    <g fill="#85B7EB">
      <rect x="186" y="68" width="66" height="22"/>
      <rect x="164" y="90" width="22" height="22"/>
      <rect x="164" y="112" width="22" height="44"/>
      <rect x="186" y="156" width="44" height="22"/>
    </g>
    <g fill="#E6F1FB">
      <rect x="186" y="90" width="66" height="22"/>
      <rect x="186" y="112" width="44" height="44"/>
    </g>
  </g>

  <!-- Right wing -->
  <g class="wing-r">
    <g fill="#85B7EB">
      <rect x="428" y="68" width="66" height="22"/>
      <rect x="494" y="90" width="22" height="22"/>
      <rect x="494" y="112" width="22" height="44"/>
      <rect x="450" y="156" width="44" height="22"/>
    </g>
    <g fill="#E6F1FB">
      <rect x="428" y="90" width="66" height="22"/>
      <rect x="450" y="112" width="44" height="44"/>
    </g>
  </g>

  <!-- Body outline + antennae -->
  <g fill="#412402">
    <g class="ant-l">
      <rect x="274" y="24" width="22" height="22"/>
      <rect x="296" y="46" width="22" height="22"/>
    </g>
    <g class="ant-r">
      <rect x="384" y="24" width="22" height="22"/>
      <rect x="362" y="46" width="22" height="22"/>
    </g>
    <rect x="274" y="68" width="132" height="22"/>
    <rect x="252" y="90" width="22" height="22"/>
    <rect x="406" y="90" width="22" height="22"/>
    <rect x="230" y="112" width="22" height="66"/>
    <rect x="428" y="112" width="22" height="66"/>
    <rect x="208" y="178" width="22" height="88"/>
    <rect x="450" y="178" width="22" height="88"/>
    <rect x="230" y="200" width="220" height="22"/>
    <rect x="230" y="244" width="220" height="22"/>
    <rect x="230" y="266" width="44" height="22"/>
    <rect x="406" y="266" width="44" height="22"/>
    <rect x="252" y="288" width="176" height="22"/>
    <rect x="318" y="310" width="44" height="22"/>
  </g>

  <!-- Yellow body -->
  <g fill="#F6B91A">
    <rect x="274" y="90" width="132" height="22"/>
    <rect x="252" y="112" width="176" height="66"/>
    <rect x="230" y="178" width="220" height="22"/>
    <rect x="230" y="222" width="220" height="22"/>
    <rect x="274" y="266" width="132" height="22"/>
  </g>

  <!-- Eyes + mouth -->
  <g fill="#412402">
    <g class="eyes">
      <rect x="274" y="112" width="44" height="44"/>
      <rect x="362" y="112" width="44" height="44"/>
    </g>
    <rect x="318" y="156" width="44" height="22"/>
  </g>

  <!-- Eye highlights -->
  <g class="glint" fill="#FFFFFF">
    <rect x="274" y="112" width="22" height="22"/>
    <rect x="362" y="112" width="22" height="22"/>
  </g>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
